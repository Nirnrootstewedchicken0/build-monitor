name: Build monitor.exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile
        run: cl /nologo /O2 monitor.c /link user32.lib /subsystem:windows /out:monitor.exe

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: monitor
          path: monitor.exe
